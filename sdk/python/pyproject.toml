[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "memory-ops-sdk"
version = "0.1.0"
description = "Typed Python client for the Memory-ops API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_ops_sdk"]
