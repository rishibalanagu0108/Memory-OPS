[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "memory-ops"
version = "0.1.0"
description = "Agent-independent Memory-as-a-Service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
memory-ops-api = "memory_ops.api:run"
memory-ops-worker = "memory_ops.worker:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
