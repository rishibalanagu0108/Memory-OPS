name: memory-ops

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: memory_ops
      POSTGRES_USER: memory_ops
      POSTGRES_PASSWORD: memory_ops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_ops -d memory_ops"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

